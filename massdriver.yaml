schema: draft-07
name: aws-eventbridge
version: 1.0.0
description: High scale publish subscribe event bus system with optional delivery rules.
source_url: https://github.com/massdriver-cloud/aws-eventbridge
params:
  examples:
  - __name: Default
    region: us-east-1
  required:
  - region
  properties:
    region:
      "$ref": https://raw.githubusercontent.com/massdriver-cloud/artifact-definitions/main/definitions/types/aws-region.json
      "$md.immutable": true
connections:
  required:
  - aws_authentication
  properties:
    aws_authentication:
      "$ref": aws-iam-role
artifacts:
  required:
  - eventbridge
  properties:
    eventbridge:
      "$ref": aws-eventbridge
ui:
  ui:order:
  - "*"
  region:
    ui:field: supportedCloudLocationsDropdown
    cloudService: AWS
steps:
- path: src
  provisioner: opentofu
  config:
    checkov:
      enable: true
